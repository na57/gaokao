<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC',sans-serif" font-size="13">
  <!-- 半圆（直径 AB，圆心 O）：A=(130,190) B=(350,190) R=110 O=(240,190) -->
  <path d="M130,190 A110,110 0 0 1 350,190 Z" fill="#eef5ff" stroke="#1f6feb" stroke-width="2.5"/>
  <!-- 直径 AB -->
  <line x1="130" y1="190" x2="350" y2="190" stroke="#444" stroke-width="2"/>
  <!-- AD、BD 构造虚线（△ADB 以 AB 为直径 ⇒ ∠ADB = 90°，泰勒斯定理） -->
  <line x1="130" y1="190" x2="272" y2="84.8" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="350" y1="190" x2="272" y2="84.8" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- OD = (a+b)/2（半径：圆心 O → D），C=(272,190) a=142 b=78 -->
  <line x1="240" y1="190" x2="272" y2="84.8" stroke="#1f6feb" stroke-width="2.5"/>
  <!-- CD = √(ab)（C 到半圆的垂线） -->
  <line x1="272" y1="190" x2="272" y2="84.8" stroke="#1f6feb" stroke-width="2.5"/>
  <!-- C 处直角标记（CD ⊥ AB，即 ∠DCO = 90°），方形角标画在角内侧，不压在线上 -->
  <path d="M272,182 L264,182 L264,190" stroke="#444" stroke-width="1.5" fill="none"/>
  <!-- D 处直角标记（∠ADB = 90°，泰勒斯定理），顶点在 D -->
  <path d="M263.16,91.34 L269.71,100.18 L278.55,93.64" stroke="#444" stroke-width="1.2" fill="none"/>
  <!-- 点 -->
  <circle cx="130" cy="190" r="3" fill="#222"/>
  <circle cx="350" cy="190" r="3" fill="#222"/>
  <circle cx="240" cy="190" r="3" fill="#222"/>
  <circle cx="272" cy="190" r="3" fill="#222"/>
  <circle cx="272" cy="84.8" r="3" fill="#222"/>
  <!-- 点标签（居中于点） -->
  <text x="130" y="208" text-anchor="middle" font-style="italic">A</text>
  <text x="350" y="208" text-anchor="middle" font-style="italic">B</text>
  <text x="240" y="208" text-anchor="middle" font-style="italic">O</text>
  <text x="272" y="208" text-anchor="middle" font-style="italic">C</text>
  <text x="286" y="80" text-anchor="middle" font-style="italic">D</text>
  <!-- 中文说明（统一放在公式下方） -->
  <text x="195" y="176" text-anchor="middle" font-size="10" fill="#1f6feb">（算术平均·半径）</text>
  <text x="305" y="164" text-anchor="middle" font-size="10" fill="#1f6feb">（几何平均）</text>
